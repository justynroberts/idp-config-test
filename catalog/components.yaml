apiVersion: idp.fintonlabs.dev/v1
kind: Component
metadata:
  name: payments-api
  title: Payments API
  description: Authorises card payments and writes them to the ledger. The one service that must never be down at 9am on Monday.
  tags: [tier-1, go, pci]
  annotations:
    # Fields listed here are hidden from anyone without entity.read.restricted.
    idp/restricted-fields: spec.costCentre
    sonarqube.org/project-key: acme_payments-api
    sentry.io/project-slug: payments-api
    datadoghq.com/service-name: payments-api
    snyk.io/project-ids: prj-payments-api
    jira/project-key: PAYMENTS
    backstage.io/kubernetes-id: payments-api
  links:
    - { title: Repository, url: "https://github.com/acme/payments-api" }
    - { title: Dashboard, url: "https://grafana.acme.example/d/payments" }
spec:
  type: service
  lifecycle: production
  tier: "1"
  owner: team-payments
  system: payments
  costCentre: CC-4410
  repo: acme/payments-api
  runbook: docs/payments-api-runbook.md
  environments: [staging, production]
  dependsOn: [fraud-scoring, resource:payments-db, resource:payments-queue]
  providesApis: [payments-openapi]
  actions: [restart-service, rotate-credentials]
  scorecards: [production-readiness]
  properties:
    language: go
    runtime: kubernetes
    pci-scope: true
    oncall-handbook: https://wiki.acme.example/payments/oncall
---
